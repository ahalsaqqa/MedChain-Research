name: Full local research experiment
on:
  workflow_dispatch:
    inputs:
      protocol:
        description: Measurement protocol
        type: choice
        options: [reportable-v1, reportable-v2]
        default: reportable-v1
permissions:
  contents: read
concurrency:
  # One group per dispatch, so independent repeated runs can execute on separate runners in parallel.
  group: medchain-full-benchmark-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CI: 'true'
      MEDCHAIN_REAL_PROOFS: 'true'
      MEDCHAIN_PROTOCOL: ${{ inputs.protocol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install retained lock
        run: |
          mkdir -p work/cloud-logs
          set +e
          npm ci >work/cloud-logs/install.raw.txt 2>&1
          result=$?
          echo "$result" >work/cloud-logs/install.exit.txt
          exit "$result"
      - name: Build
        run: |
          set +e
          npm run build >work/cloud-logs/build.raw.txt 2>&1
          result=$?
          echo "$result" >work/cloud-logs/build.exit.txt
          exit "$result"
      - name: Functional tests, serially
        run: |
          set +e
          npm run test:functional -- --runInBand >work/cloud-logs/functional.raw.txt 2>&1
          result=$?
          echo "$result" >work/cloud-logs/functional.exit.txt
          exit "$result"
      - name: Full actual-proof benchmark
        run: |
          set +e
          node build/src/benchmark.js --seed 20261014 --protocol "${MEDCHAIN_PROTOCOL:-reportable-v1}" --output work/benchmark-full >work/cloud-logs/benchmark.raw.txt 2>&1
          result=$?
          echo "$result" >work/cloud-logs/benchmark.exit.txt
          exit "$result"
      - name: Collect sanitized evidence even after failure
        if: always()
        run: node scripts/collect-cloud-evidence.mjs
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medchain-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/cloud-evidence/logs/*.txt
            work/cloud-evidence/runs/*/metadata.json
            work/cloud-evidence/runs/*/events.jsonl
            work/cloud-evidence/runs/*/observations.jsonl
            work/cloud-evidence/runs/*/observations.json
            work/cloud-evidence/runs/*/observations.csv
            work/cloud-evidence/runs/*/summaries.json
            work/cloud-evidence/runs/*/summaries.csv
            work/cloud-evidence/runs/*/membership-proof-N*.json
            work/cloud-evidence/runs/*/membership-verification-key.json
            work/cloud-evidence/runs/*/registry-verification-key.json
            work/cloud-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30
